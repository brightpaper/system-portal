<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bright Paper Portal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ═══════════════════════════════════════════════════════════════════
   BRIGHT PAPER — PORTAL APP (wrapper)

   Ye file portal NAHI hai. Portal wahi Apps Script wala hai, isi ke
   andar khulta hai. Is file ka ek hi kaam hai: notification dikhana.

   Kyun alag file? Apps Script ka page ek iframe me chalta hai, aur
   Chrome/Firefox aise iframe ko notification ki ijazat maangne hi nahi
   dete. Ye file apne asli pate (github.io) par chalti hai, isliye
   ijazat maang sakti hai. Portal postMessage se batata hai "ye naya
   aaya", aur ye file notification dikha deti hai.
   ═══════════════════════════════════════════════════════════════════ */
html,body{margin:0;height:100%;background:#F4F5F9;overflow:hidden;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
#app{position:fixed;left:0;right:0;bottom:0;top:0;width:100%;height:100%;border:0;
  background:#F4F5F9}
body.ask #app{top:52px;height:calc(100% - 52px)}

/* Upar ki patli patti — sirf tab jab ijazat abhi maangi nahi */
#bar{display:none;position:fixed;left:0;right:0;top:0;height:52px;z-index:5;
  align-items:center;gap:10px;padding:0 12px 0 14px;box-sizing:border-box;
  background:#FFF2EA;border-bottom:1px solid #FFD4BC;color:#5A2A0C;font-size:13.5px}
body.ask #bar{display:flex}
#bar span{flex:1;min-width:0;line-height:1.3}
#bar b{color:#A63E11}
#bar button{font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:8px 14px;
  cursor:pointer;white-space:nowrap}
#on{color:#fff;background:#F26522;border:1px solid #F26522}
#later{color:#7A4A2C;background:transparent;border:1px solid transparent}

/* URL abhi bhara nahi */
#setup{display:none;max-width:560px;margin:60px auto;padding:24px;background:#fff;
  border:1px solid #E6E8EF;border-radius:14px;color:#394154;font-size:14px;line-height:1.6}
#setup code{background:#F4F5F9;border:1px solid #E6E8EF;border-radius:5px;padding:1px 6px}
</style>
</head>
<body>
<div id="bar">
  <span><b>Turn on notifications</b> &mdash; get every leave, ticket and birthday
    update straight on your phone or computer.</span>
  <button id="on" type="button">Turn on</button>
  <button id="later" type="button">Later</button>
</div>
<iframe id="app" title="Bright Paper Portal" allow="clipboard-write"></iframe>
<div id="setup">
  <h3 style="margin-top:0">The portal address is not set yet</h3>
  In this file (<code>index.html</code>), replace <code>PORTAL</code> near the top with
  your Apps Script web app's <code>/exec</code> URL, in the company form
  (<code>/a/macros/brightpaper.co.in/s/&hellip;/exec</code>).
</div>

<!-- Firebase: sirf push ke liye. Na mile (net band) to app pehle jaisi chalti hai. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<script>
/* ── YAHAN APNA URL ──────────────────────────────────────────────────
   Apps Script > Deploy > Manage deployments > Web app ka URL.
   /exec par khatam hona chahiye.

   COMPANY WALA ROOP: .../a/macros/brightpaper.co.in/s/ID/exec
   Portal ka access "Anyone within brightpaper" hai. Bina company ke naam
   ke (.../macros/s/ID/exec), jis browser me do Google account login hon
   (company + personal), Google PEHLE account se kholta hai — wo personal
   ho to "Sorry, unable to open the file" aata hai. Rashmi ke PC par yahi
   hota tha; company wala link wahan khul gaya.

   Portal ki Code.gs me PORTAL_URL bhi yahi hai — ID badle to dono jagah. */
var PORTAL = 'https://script.google.com/a/macros/brightpaper.co.in/s/AKfycbxu5yLXD5ylfv8M1rb6g1c2SZ-dcKjlole4x2UYO4DeWMqKpVD103L4pHRmhsFl5TsnGQ/exec';

/* ── Firebase (public cheezein — inme koi raaz nahi) ───────────────── */
var FB = {
  apiKey: 'AIzaSyBl--envqRSsVmG86HhpGoByoK7Gf3XM5o',
  authDomain: 'system-portal-c6b67.firebaseapp.com',
  projectId: 'system-portal-c6b67',
  storageBucket: 'system-portal-c6b67.firebasestorage.app',
  messagingSenderId: '349426254052',
  appId: '1:349426254052:web:ee2487e822d5984434acf1'
};
/* Firebase > Project settings > Cloud Messaging > Web Push certificates
   wali lambi key. Jab tak ye nahi bhari, app push ke bina chalti rahegi. */
var VAPID = 'BHdwjja2q6x9QyLljCvp2-Ov93GGiCrhKVctQvgYQe0gD9mvwo0lZJnob27pQrqDPqFO7Pk6vGimSKCDTOQkYyw';

/* Is app ka version — portal ke "Test notifications" page par dikhta hai */
var WRAP_VER = '22Sep-04';

(function () {
  var frame = document.getElementById('app');
  var fcmToken = '', msg = null;
  var pushAt = 0, fcmErr = '';     // aakhri push kab aaya / token kyun nahi mila
  var pWin = null, pOrigin = '', reg = null;
  var hashNav = (location.hash || '').replace('#', '');

  if (/PASTE_YOUR/.test(PORTAL)) {
    frame.style.display = 'none';
    document.getElementById('setup').style.display = 'block';
    return;
  }
  frame.src = PORTAL;

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(function (r) { reg = r; getFcm(); })
      .catch(function (e) { fail('Service worker: ' + ((e && e.message) || e)); });
    /* notification par click -> service worker -> yahan -> portal
       push aaya (app khuli thi)  -> service worker -> yahan -> portal */
    navigator.serviceWorker.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.bp === 'open') { window.focus(); tell({ bp: 'open', nav: d.nav || '' }); }
      if (d.bp === 'got')  { pushAt = Number(d.at) || Date.now(); tell({ bp: 'pushok', at: pushAt }); }
    });
  } else fail('This browser has no service worker support');

  /* Pichhla saboot — is device par aakhri push kab pahuncha tha */
  try {
    if ('caches' in window) caches.open('bp-meta')
      .then(function (c) { return c.match('push-ok'); })
      .then(function (r) { return r ? r.text() : ''; })
      .then(function (t) {
        var n = Number(t) || 0;
        if (n > pushAt) { pushAt = n; tell({ bp: 'pushok', at: n }); }
      }).catch(function () {});
  } catch (e) {}

  /* Token kyun nahi mila — pehle ye sirf console me jata tha, ab portal
     ke Test page par dikhta hai */
  function fail(why) {
    fcmErr = String(why || '').slice(0, 180);
    tell({ bp: 'fcmerr', why: fcmErr });
  }
  function hi() { return { bp: 'wrap', perm: perm(), pushAt: pushAt, fcmErr: fcmErr, ver: WRAP_VER }; }

  function perm() { return ('Notification' in window) ? Notification.permission : 'unsupported'; }
  function tell(m) { if (pWin) try { pWin.postMessage(m, pOrigin); } catch (e) {} }

  /* ── Asli push: is device ka Firebase token ──
     Ijazat mil chuki ho aur key bhari ho tabhi. Token portal ko jaata hai,
     portal use server par is insaan ke naam likh deta hai. Token pehle
     mil jaye aur portal baad me aaye, to "hello" par bhej dete hain.   */
  function getFcm() {
    if (fcmToken || !reg || perm() !== 'granted' || /PASTE_/.test(VAPID)) return;
    if (typeof firebase === 'undefined' || !firebase.messaging) return;
    try {
      if (!firebase.apps.length) firebase.initializeApp(FB);
      var sup = firebase.messaging.isSupported();
      if (sup === false) {                             // purana browser / iPhone bina Home Screen
        fail('This browser cannot receive push (on iPhone: add the app to the Home Screen first)');
        return;
      }
      msg = msg || firebase.messaging();
      /* app saamne khuli ho tab Firebase notification khud nahi dikhata \u2014
         hum dikhate hain, taaki har haal me ek jaisi aaye */
      if (!msg._bp) {
        msg._bp = true;
        msg.onMessage(function (p) {
          var d = (p && p.data) || {};
          show([{ title: d.title, body: d.body, tag: d.tag, nav: d.nav }]);
        });
      }
      msg.getToken({ vapidKey: VAPID, serviceWorkerRegistration: reg })
        .then(function (t) {
          if (t) { fcmToken = t; fcmErr = ''; tell({ bp: 'fcm', token: t }); }
          else fail('Firebase returned no push address');
        })
        .catch(function (e) { console.log('FCM token nahi mila:', e); fail((e && (e.code || e.message)) || e); });
    } catch (e) { console.log('FCM:', e); fail((e && e.message) || e); }
  }

  /* Patti tabhi, jab ijazat abhi maangi nahi aur "Baad me" aaj nahi dabaya */
  function bar() {
    var snooze = 0;
    try { snooze = Number(localStorage.getItem('bp-later') || 0); } catch (e) {}
    var show = perm() === 'default' && Date.now() - snooze > 20 * 3600 * 1000;
    document.body.classList.toggle('ask', show);
  }

  function badge(n) {
    try {
      if (n > 0 && navigator.setAppBadge) navigator.setAppBadge(n);
      else if (navigator.clearAppBadge) navigator.clearAppBadge();
    } catch (e) {}
  }

  function show(list) {
    if (perm() !== 'granted' || !list || !list.length) return;
    list.slice(0, 6).forEach(function (x) {
      var opt = { body: x.body || '', icon: 'icon-192.png', badge: 'icon-192.png',
                  tag: x.tag || undefined, renotify: !!x.tag, data: { nav: x.nav || '' } };
      if (reg && reg.showNotification) { reg.showNotification(x.title || 'Bright Paper', opt); return; }
      try {                                   /* purana browser, bina service worker */
        var n = new Notification(x.title || 'Bright Paper', opt);
        n.onclick = function () { window.focus(); tell({ bp: 'open', nav: x.nav || '' }); n.close(); };
      } catch (e) {}
    });
  }

  /* Sirf portal ki baat suno — googleusercontent se aane wali */
  window.addEventListener('message', function (e) {
    var host = '';
    try { host = new URL(e.origin).hostname; } catch (x) {}
    if (!/\.googleusercontent\.com$/.test(host)) return;
    var d = e.data || {};
    if (!d.bp) return;
    pWin = e.source; pOrigin = e.origin;

    if (d.bp === 'hello') {
      tell(hi());
      if (fcmToken) tell({ bp: 'fcm', token: fcmToken }); else getFcm();
      bar();
      if (hashNav) { tell({ bp: 'open', nav: hashNav }); hashNav = ''; history.replaceState(null, '', './'); }
    }
    if (d.bp === 'notify') { badge(d.badge || 0); show(d.list); }
    if (d.bp === 'badge')  badge(d.n || 0);
  });

  document.getElementById('on').onclick = function () {
    if (!('Notification' in window)) { alert('This browser does not support notifications.'); return; }
    Notification.requestPermission().then(function (p) {
      var m = hi(); m.bp = 'perm'; tell(m);
      bar();
      if (p === 'granted') getFcm();
      if (p === 'granted') show([{ title: 'Notifications are on',
        body: 'New portal updates will appear here.', tag: 'bp-hello' }]);
    });
  };
  document.getElementById('later').onclick = function () {
    try { localStorage.setItem('bp-later', String(Date.now())); } catch (e) {}
    bar();
  };
})();
</script>
</body>
</html>
